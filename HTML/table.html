<!DOCTYPE html>
<html lang="ru">
    <title>
        Таблица
    </title>
<body>
    <head>
        <meta charset="utf-8">
        <h3>
            <a href="main.html">Главная</a>
            <br>
            <a href="main.html"><big>Самые телефонные телефоны</big></a>
        </h3>
        <hr>
    </head>

    <!--Фильтр График-->

    <details open="open">
        <summary> График </summary>
        <br>
        <form>
            <!--Значениие по ОХ-->
            <div>
                <legend><b>Значение по оси OX</b></legend>
                    <label>
                        <input type="radio" name="ox">
                        Тип
                    </label><br>

                    <label>
                        <input type="radio" name="ox">
                        Страна
                    </label><br>

                    <label>
                        <input type="radio" name="ox">
                        Год
                    </label><br>
            </div>

            <!--Значениие по OY-->
            <br>
            <div>
                <legend><b>Значение по оси OY</b></legend>
                    <label>
                        <input type="checkbox" name="oy">
                        Чето1
                    </label><br>

                    <label>
                        <input type="checkbox" name="oy">
                        Чето2
                    </label><br>

                    <label>
                        <input type="checkbox" name="oy">
                        Чето3
                    </label><br>
                <br>
                <div>
                    <input type="button" value="Построить">
                </div>
            </div>
        </form>
        <br>
        <div>
            Тут будет график
        </div>
    </details>

     <!--Фильтр Фильтр-->

    <br>
    <details open="open">
        <summary>Фильтр</summary>
        
        <p>
            <label>Название:</label>
            <input type="text">
        </p>
        
        <p>
            <label>Тип:</label>
            <input type="text">
        </p>
        
        <p>
            <label>Год от:</label>
            <input type="text" size="10">
            <label>до</label>
            <input type="text" size="10">
        </p>
        
        <input type="button" value="Найти">
    </details>

    <!--Фильтр Сортировка-->
    <br>
    <details open="open">
        <summary>Сортировка</summary>
        
        <p>
            <label>Первый уровень:</label>
            <select>
                <option>Нет</option>
                <option>Чето1</option>
                <option>Чето2</option>
            </select>
            <label>по убыванию?</label>
            <input type="checkbox">
        </p>
        
        <p>
            <label>Второй уровень:</label>
            <select>
                <option>Нет</option>
                <option>Чето1</option>
                <option>Чето2</option>
            </select>
            <label>по убыванию?</label>
            <input type="checkbox">
        </p>

        <p>
            <label>Третий уровень:</label>
            <select>
                <option>Нет</option>
                <option>Чето1</option>
                <option>Чето2</option>
            </select>
            <label>по убыванию?</label>
            <input type="checkbox">
        </p>
        
        <input type="button" value="Сортировать">
    </details>

</body>
</html>
