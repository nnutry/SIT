        <br>

            <div>

            </div>

            </div>

                <label>

                </label>
            </div>

            <div>

                    Чето2
                </label>
            </div>

            <div>

                    Чето3
                </label>
            </div>

            <br>
            <div>
                <input type="button" value="Построить">
            </div>
        </form>
    </details>
